name: Fix Rückenstrecker Sprungerkennung

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/disable-rueckenstrecker-break.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable automatic structure break for Rückenstrecker
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "function exBreak(exId){\n  const h = exHistory(exId);"
          new = "function exBreak(exId){\n  const ex = getEx(exId);\n  if(ex && ex.name === 'Rückenstrecker (Hyperextension)') return null;\n  const h = exHistory(exId);"
          if old not in s:
              raise SystemExit('Target exBreak snippet not found; no change made')
          if new not in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/disable-rueckenstrecker-break.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/disable-rueckenstrecker-break.yml
          git diff --cached --quiet && exit 0
          git commit -m "Disable false jump detection for Rückenstrecker"
          git push
